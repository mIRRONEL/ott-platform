# ==============================================================================
# OTT Platform - Master Compose Orchestrator
# ==============================================================================
# Segregated Modular Stacks Included:
#   - compose/databases.yml   (PostgreSQL, MongoDB, Redis, Elasticsearch)
#   - compose/kafka.yml       (Kafka Brokers 1-3 & Topics Initializer)
#   - compose/services.yml    (Backend Microservices, Transcoder, API Gateway)
#   - compose/frontend.yml    (Web App & Unified Nginx Edge Proxy)
#   - compose/monitoring.yml  (Prometheus, Grafana, Loki, Promtail, cAdvisor)
#
# Dynamic Troubleshooting & Production Overlays:
#   - docker-compose.resources.yml  (CPU & RAM Limits)
#   - docker-compose.security.yml   (Production Container Security Hardening)
#   - docker-compose.debug.yml      (Direct Microservice Port Exposure)
#
# Manage Modes with: ./scripts/set-mode.sh [prod | unconstrained | debug]
# ==============================================================================

name: ott-app

include:
  - compose/databases.yml
  - compose/kafka.yml
  - compose/services.yml
  - compose/frontend.yml
  - compose/monitoring.yml

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  ott_uploads:
  ott_hls:
  videos_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_cache:

networks:
  ott-network:
    driver: bridge
    enable_ipv6: false
  ott-edge-net:
    driver: bridge
    enable_ipv6: false
  ott-app-net:
    driver: bridge
    enable_ipv6: false
  ott-data-net:
    driver: bridge
    enable_ipv6: false

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_app_password:
    file: ./secrets/mongo_app_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  stripe_api_key:
    file: ./secrets/stripe_api_key.txt
  internal_service_secret:
    file: ./secrets/internal_service_secret.txt
