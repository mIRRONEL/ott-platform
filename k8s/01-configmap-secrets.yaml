apiVersion: v1
kind: ConfigMap
metadata:
  name: ott-config
  namespace: ott-platform
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  
  # Database Hosts
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "ott_platform"
  DB_APP_USER: "ott_user"
  
  # Mongo & Redis & Elasticsearch
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  MONGO_INITDB_DATABASE: "ott_platform"
  MONGO_APP_USER: "ott_user"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  ELASTICSEARCH_HOST: "elasticsearch"
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  
  # Kafka Cluster
  KAFKA_BROKERS: "kafka-0.kafka-headless.ott-platform.svc.cluster.local:9092,kafka-1.kafka-headless.ott-platform.svc.cluster.local:9092,kafka-2.kafka-headless.ott-platform.svc.cluster.local:9092"
  KAFKA_COMPRESSION_TYPE: "snappy"
  
  # Video Directories
  VIDEOS_DIR: "/videos"
  ENCODED_VIDEOS_DIR: "/videos/encoded"
  RAW_VIDEOS_DIR: "/videos/raw"
  UPLOAD_DIR: "/videos/uploads"
  AUTO_DELETE_RAW_AFTER_ENCODE: "true"
  FFMPEG_PRESET: "superfast"
  FFMPEG_THREADS_PER_PROFILE: "2"
  
  # Internal URLs
  AUTH_SERVICE_URL: "http://auth-service:3001"
  USER_SERVICE_URL: "http://user-service:3002"
  CONTENT_SERVICE_URL: "http://content-service:3003"
  STREAMING_SERVICE_URL: "http://streaming-service:3004"
  PAYMENT_SERVICE_URL: "http://payment-service:3005"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3006"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3007"
  LIVE_SERVICE_URL: "http://live-service:3009"
---
