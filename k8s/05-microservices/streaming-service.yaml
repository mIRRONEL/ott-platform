apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: ott-platform
  labels:
    app: streaming-service
    tier: edge
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streaming-service
  template:
    metadata:
      labels:
        app: streaming-service
        tier: edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: streaming-service
          image: ott-streaming-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ott-config
            - secretRef:
                name: ott-secrets
          env:
            - name: PORT
              value: "3004"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            - name: REQUEST_TIMEOUT
              value: "300000"
          ports:
            - containerPort: 3004
              name: http
          volumeMounts:
            - name: video-storage
              mountPath: /videos
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      volumes:
        - name: video-storage
          persistentVolumeClaim:
            claimName: videos-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: ott-platform
  labels:
    app: streaming-service
spec:
  type: ClusterIP
  ports:
    - port: 3004
      targetPort: 3004
      name: http
  selector:
    app: streaming-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streaming-service-hpa
  namespace: ott-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streaming-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
