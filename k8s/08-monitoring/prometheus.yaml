apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ott-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
      scrape_timeout: 9s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager:9093']

      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:3000']
        metrics_path: '/metrics'

      - job_name: 'auth-service'
        static_configs:
          - targets: ['auth-service:3001']
        metrics_path: '/metrics'

      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service:3002']
        metrics_path: '/metrics'

      - job_name: 'content-service'
        static_configs:
          - targets: ['content-service:3003']
        metrics_path: '/metrics'

      - job_name: 'streaming-service'
        static_configs:
          - targets: ['streaming-service:3004']
        metrics_path: '/metrics'

      - job_name: 'payment-service'
        static_configs:
          - targets: ['payment-service:3005']
        metrics_path: '/metrics'

      - job_name: 'notification-service'
        static_configs:
          - targets: ['notification-service:3006']
        metrics_path: '/metrics'

      - job_name: 'analytics-service'
        static_configs:
          - targets: ['analytics-service:3007']
        metrics_path: '/metrics'

      - job_name: 'encoding-service'
        static_configs:
          - targets: ['encoding-service:3008']
        metrics_path: '/metrics'

      - job_name: 'live-service'
        static_configs:
          - targets: ['live-service:3009']
        metrics_path: '/metrics'

  alert_rules.yml: |
    groups:
      - name: microservices_application_alerts
        rules:
          - alert: MicroserviceDown
            expr: up{job=~".*-service|api-gateway"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Microservice {{ $labels.job }} is down"
              description: "Microservice instance has been unreachable for > 1 minute."

          - alert: High5xxErrorRate
            expr: (sum by(service) (rate(http_requests_total{status_code=~"5.."}[2m])) / sum by(service) (rate(http_requests_total[2m]))) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP 5xx error rate on {{ $labels.service }}"
              description: "HTTP 5xx error rate exceeds 5% of total traffic on {{ $labels.service }}."

          - alert: HighHttpLatencyP95
            expr: histogram_quantile(0.95, sum by(le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 2
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "High P95 latency on {{ $labels.service }}"
              description: "P95 request latency exceeds 2 seconds on {{ $labels.service }}."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ott-platform
  labels:
    app: prometheus
    tier: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        tier: monitoring
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.49.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ott-platform
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
