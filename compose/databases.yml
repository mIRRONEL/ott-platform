# ==============================================================================
# OTT Platform - Database Tier
# ==============================================================================
# Services: PostgreSQL, MongoDB, Redis, Elasticsearch
# ==============================================================================

services:
  # PostgreSQL Database - Optimized for connections
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ott_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_APP_USER: ${DB_APP_USER:-ott_user}
      DB_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_password
      - postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db-sql/postgres-init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - ott-data-net
      - ott-network
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    restart: unless-stopped

  # MongoDB - Optimized for high throughput
  mongodb:
    image: mongo:6.0
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-ott_platform}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_APP_USER: ${MONGO_APP_USER:-ott_user}
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_root_password
      - mongo_app_password
    volumes:
      - mongodb_data:/data/db
      - ../db-sql/mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - ott-data-net
      - ott-network
    healthcheck:
      test: [ "CMD-SHELL", "mongosh -u \"$${MONGO_INITDB_ROOT_USERNAME:-root}\" -p \"$$(cat /run/secrets/mongo_root_password 2>/dev/null || echo $$MONGO_ROOT_PASSWORD)\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' --quiet | grep 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --maxConns=1000
    restart: unless-stopped

  # Redis - Optimized for caching
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - ott-data-net
      - ott-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512m --maxmemory-policy allkeys-lru --tcp-backlog 511
    restart: unless-stopped

  # Elasticsearch - Optimized for search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ott-data-net
      - ott-network
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
