groups:
  - name: host_and_infrastructure_alerts
    rules:
      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host node-exporter is down on {{ $labels.instance }}"
          description: "Node exporter has been unreachable for more than 1 minute."

      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU load is above 85% for 5 minutes (Current: {{ $value }}%)."

      - alert: HostLowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Available host memory is below 10% (Current: {{ $value }}%)."

      - alert: HostDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critical on {{ $labels.instance }}"
          description: "Available root disk space is below 10% (Current: {{ $value }}%)."

  - name: microservices_application_alerts
    rules:
      - alert: MicroserviceDown
        expr: up{job=~".*-service|api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Microservice {{ $labels.job }} is down"
          description: "Microservice instance has been unreachable for > 1 minute."

      - alert: High5xxErrorRate
        expr: (sum by(service) (rate(http_requests_total{status_code=~"5.."}[2m])) / sum by(service) (rate(http_requests_total[2m]))) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.service }}"
          description: "HTTP 5xx error rate exceeds 5% of total traffic on {{ $labels.service }}."

      - alert: HighHttpLatencyP95
        expr: histogram_quantile(0.95, sum by(le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.service }}"
          description: "P95 request latency exceeds 2 seconds on {{ $labels.service }} (Current: {{ $value }}s)."

      - alert: NodeJsEventLoopLagHigh
        expr: nodejs_eventloop_lag_seconds > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Node.js Event Loop Lag on {{ $labels.job }}"
          description: "Event loop lag is > 500ms on {{ $labels.job }} (Current: {{ $value }}s)."

  - name: database_and_queue_alerts
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Database is down"
          description: "Postgres exporter cannot connect to PostgreSQL database."

      - alert: PostgresHighConnections
        expr: (pg_stat_activity_count / pg_settings_max_connections) * 100 > 80
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool near capacity"
          description: "Postgres active connections exceed 80% of max_connections."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis Cache is down"
          description: "Redis exporter cannot ping Redis instance."

      - alert: RedisHighMemoryUsage
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory utilization high"
          description: "Redis memory usage exceeds 85% of maxmemory allocation."

      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{status="red"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Elasticsearch Cluster Status RED"
          description: "Primary shards in Elasticsearch are missing or corrupted."

      - alert: KafkaBrokerDown
        expr: kafka_brokers < 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker offline in cluster"
          description: "Kafka broker count is below cluster quorum of 3 brokers (Current: {{ $value }})."

      - alert: KafkaHighConsumerLag
        expr: sum by(consumergroup, topic) (kafka_consumergroup_lag) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka Consumer Lag on group {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} is lagging by > 1000 messages on topic {{ $labels.topic }}."

  - name: edge_proxy_and_synthetic_alerts
    rules:
      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx Edge Proxy is down"
          description: "Nginx exporter cannot scrape stub_status on ott-nginx."

      - alert: SyntheticProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Synthetic Health Probe Failed for {{ $labels.instance }}"
          description: "Blackbox HTTP probe failed to get valid HTTP 2xx from {{ $labels.instance }}."
