services:
  postgres:
    image: postgres:15-alpine
    container_name: ott-postgres
    environment:
      POSTGRES_DB: ott_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ott-network

  mongodb:
    image: mongo:6.0
    container_name: ott-mongodb
    environment:
      MONGO_INITDB_DATABASE: ott_platform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ott-network

  redis:
    image: redis:7-alpine
    container_name: ott-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ott-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    container_name: ott-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ott-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ott-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ott-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ott-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ott-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: ott-auth-service
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: ott_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: your_jwt_secret_here
    ports:
      - "3001:3001"
    networks:
      - ott-network
    command: npm start

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: ott-user-service
    depends_on:
      - postgres
      - mongodb
      - redis
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: ott_platform
      MONGODB_URI: mongodb://mongodb:27017/user_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: your_jwt_secret_here
    ports:
      - "3002:3002"
    networks:
      - ott-network
    command: npm start

  content-service:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    container_name: ott-content-service
    depends_on:
      - mongodb
      - elasticsearch
      - redis
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGODB_URL: mongodb://mongodb:27017/ott_platform
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: your_jwt_secret_here
      UPLOAD_DIR: /tmp/ott-uploads
      HLS_OUTPUT_DIR: /tmp/ott-hls
      KAFKA_BROKERS: kafka:29092
    ports:
      - "3003:3003"
    volumes:
      - ott_uploads:/tmp/ott-uploads
    networks:
      - ott-network
    command: npm start

  streaming-service:
    build:
      context: ./services/streaming-service
      dockerfile: Dockerfile
    container_name: ott-streaming-service
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: ott_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: your_jwt_secret_here
    ports:
      - "3004:3004"
    networks:
      - ott-network
    command: npm start

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: ott-payment-service
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: ott_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: your_jwt_secret_here
      STRIPE_API_KEY: sk_test_placeholder
    ports:
      - "3005:3005"
    networks:
      - ott-network
    command: npm start

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: ott-notification-service
    depends_on:
      - kafka
      - redis
    environment:
      NODE_ENV: production
      PORT: 3006
      KAFKA_BROKERS: kafka:29092
      KAFKA_CONSUMER_GROUP: notification-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_jwt_secret_here
    ports:
      - "3006:3006"
    networks:
      - ott-network
    command: npm start

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: ott-analytics-service
    depends_on:
      - postgres
      - mongodb
      - redis
      - kafka
    environment:
      NODE_ENV: production
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: ott_platform
      MONGODB_URI: mongodb://mongodb:27017/analytics_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_CONSUMER_GROUP: analytics-service
      JWT_SECRET: your_jwt_secret_here
    ports:
      - "3007:3007"
    networks:
      - ott-network
    command: npm start

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: ott-api-gateway
    depends_on:
      - auth-service
      - user-service
      - content-service
      - streaming-service
      - payment-service
      - notification-service
      - analytics-service
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: your_jwt_secret_here
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      CONTENT_SERVICE_URL: http://content-service:3003
      STREAMING_SERVICE_URL: http://streaming-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      ANALYTICS_SERVICE_URL: http://analytics-service:3007
    ports:
      - "3000:3000"
    networks:
      - ott-network
    command: npm start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ott-frontend
    depends_on:
      - api-gateway
    environment:
      NODE_ENV: production
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    networks:
      - ott-network
    environment:
      NODE_ENV: production
      VITE_API_URL: http://localhost:3000/api

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  ott_uploads:

networks:
  ott-network:
    driver: bridge
