name: OTT Platform - Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Lint & Static Analysis
  # ==========================================
  lint:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Verify Docker Compose Config
        run: |
          echo "Validating docker-compose.yml syntax..."
          docker compose config --quiet
          echo "✓ docker-compose.yml is valid"

  # ==========================================
  # 2. Microservices Matrix Test & Build
  # ==========================================
  test-services:
    name: 🧪 Test & Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - content-service
          - streaming-service
          - encoding-service
          - payment-service
          - notification-service
          - analytics-service
          - live-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Compile TypeScript & Build
        working-directory: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
        run: |
          npm run build

      - name: Run Unit Tests (if configured)
        working-directory: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
        run: |
          if npm run | grep -q "test"; then
            npm test --if-present
          fi

  # ==========================================
  # 3. Docker Multi-Stage Image Build Verification
  # ==========================================
  docker-build-verify:
    name: 🐳 Docker Image Build Verification
    needs: [lint, test-services]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - content-service
          - streaming-service
          - live-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: false
          tags: ott-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
