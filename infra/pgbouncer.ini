# PostgreSQL Connection Pooling Configuration Guide
# For PgBouncer (connection pooler) - Optional but recommended for scaling

[databases]
ott_platform = host=postgres port=5432 dbname=ott_platform user=postgres password=postgres_secure_password_123

[pgbouncer]
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100
max_user_connections = 100
server_lifetime = 3600
server_idle_timeout = 600
query_timeout = 0
query_wait_timeout = 120
idle_in_transaction_session_timeout = 0

[statistics]
