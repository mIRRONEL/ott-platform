user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  65535;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Dynamic WebSocket & HTTP Connection Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker Internal DNS Resolver for Dynamic Container IP Refresh
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Real Client IP Resolution
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # High-Concurrency Network & File I/O Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 100000;
    reset_timedout_connection on;
    client_header_timeout 60s;
    client_body_timeout 300s;
    send_timeout 300s;
    types_hash_max_size 2048;
    server_tokens off;

    # Fast File & Metadata Caching
    open_file_cache          max=50000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Large upload buffers for 4K video files
    client_max_body_size 10G;
    client_body_buffer_size 1M;

    # Proxy buffer settings
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # High-Performance HLS Video Caching
    # In-memory keys zone (100MB) + Disk cache (10GB max)
    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=HLS_CACHE:100m inactive=24h max_size=10g use_temp_path=off;

    # Log format with performance metrics
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                      'cache=$upstream_cache_status';

    access_log  /var/log/nginx/access.log  main;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Include custom site configs
    include /etc/nginx/conf.d/*.conf;
}
