      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 64M

  # ----------------------------------------------------------------------------
  # TIER 4: OBSERVABILITY, TELEMETRY & LOGGING STACK
